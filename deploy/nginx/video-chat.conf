# Video Chat Room production reverse proxy.
#
# Assumptions:
# - TLS is terminated by this nginx server.
# - Exactly one Node.js application process listens on 127.0.0.1:3001.
# - The built SPA files from `client/dist` are deployed to /var/www/video-chat.
# - Replace example.com and certificate paths for the target environment.

upstream video_chat_node {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/video-chat;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /healthz {
        proxy_pass http://video_chat_node;
    }

    location = /health {
        proxy_pass http://video_chat_node;
    }

    location = /readyz {
        proxy_pass http://video_chat_node;
    }

    location = /metrics {
        proxy_pass http://video_chat_node;
    }

    location /socket.io/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://video_chat_node;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
