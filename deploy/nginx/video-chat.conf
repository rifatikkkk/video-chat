# Video Chat Room production reverse proxy.
#
# Assumptions:
# - TLS is terminated by this nginx server.
# - Exactly one Node.js application process listens on 127.0.0.1:3001.
# - The built SPA files from `client/dist` are deployed to /var/www/video-chat.
# - Replace example.com and certificate paths for the target environment.

upstream video_chat_node {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $video_chat_sanitized_uri {
    ~^/room/ /room/[room-id-redacted];
    default $uri;
}

map $uri $video_chat_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

log_format video_chat_safe '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $video_chat_sanitized_uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=video_chat_handshake:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=video_chat_http:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/video-chat;
    index index.html;

    access_log /var/log/nginx/video-chat.access.log video_chat_safe;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $video_chat_cache_control always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /healthz {
        limit_req zone=video_chat_http burst=40 nodelay;
        proxy_pass http://video_chat_node;
    }

    location = /health {
        limit_req zone=video_chat_http burst=40 nodelay;
        proxy_pass http://video_chat_node;
    }

    location = /readyz {
        limit_req zone=video_chat_http burst=40 nodelay;
        proxy_pass http://video_chat_node;
    }

    location = /metrics {
        limit_req zone=video_chat_http burst=20 nodelay;
        proxy_pass http://video_chat_node;
    }

    location /socket.io/ {
        limit_req zone=video_chat_handshake burst=20 nodelay;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://video_chat_node;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
