name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Clean install, checks, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Check workspace versions
        run: npm run check:versions

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Write CI report
        if: always()
        shell: bash
        run: |
          {
            echo "workflow=CI"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "commit=${GITHUB_SHA}"
            echo "result=${{ job.status }}"
            echo "checks=clean-install,check-versions,lint,unit,integration,build"
          } > ci-report.txt

      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.txt
